name: Build KasPriv Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 platforms;android-35 build-tools;36.0.0 build-tools;35.0.0 platform-tools'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          node scripts/patch-android-build-gradle.js
          node scripts/copy-android-icons.js
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Grant Execute Permissions for Gradle
        run: |
          mkdir -p temp-gradle
          cd temp-gradle
          touch settings.gradle
          gradle wrapper --gradle-version 8.14.3
          cd ..
          cp temp-gradle/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp temp-gradle/gradle/wrapper/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp temp-gradle/gradlew android/gradlew
          rm -rf temp-gradle
          chmod +x android/gradlew

      - name: Build Android APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          
          # Handle Production Signing if Secrets are present
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Signing secret detected. Recreating keystore..."
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/release.keystore
            export RELEASE_STORE_FILE="release.keystore"
          else
            echo "No signing secret found. Falling back to debug signing for this build."
          fi

          echo "Current working directory: $(pwd)"
          echo "Java version:"
          java -version
          echo "Gradle version:"
          ./gradlew --version
          
          echo "Starting Gradle Build..."
          # Attempt to build, capturing EVERYTHING, no matter the exit code
          # We use '|| true' or similar to ensure we reach the 'cat' command even on failure
          ./gradlew assembleDebug assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test --no-daemon --stacktrace --info > ../gradle_full.log 2>&1 || BUILD_FAILED=true
          
          # Print the full log regardless of success/failure so it's in the GitHub Actions UI
          echo "========== FULL GRADLE LOG START =========="
          cat ../gradle_full.log
          echo "========== FULL GRADLE LOG END =========="
          
          # Now check if it actually succeeded
          if [ "$BUILD_FAILED" = "true" ] || [ ! -d "app/build/outputs/apk" ]; then
            echo "Build FAILED: Gradle build returned an error or APK output directory was not created."
            exit 1
          fi

      - name: Stage APK Files
        run: |
          mkdir -p release-apks
          # Debugging: List all contents of the build outputs directory to find the APKs
          echo "Debugging build directory contents:"
          ls -R android/app/build/outputs/ || echo "Directory not found"
          
          # Find all release apk files and copy them (preferring release over unsigned)
          find android/app/build/outputs/apk -name "app-release.apk" -exec cp {} release-apks/KasPriv-Wallet-Release.apk \; || true
          find android/app/build/outputs/apk -name "app-release-unsigned.apk" -exec cp {} release-apks/KasPriv-Wallet-Release.apk \; || true
          # Find all debug apk files and copy them
          find android/app/build/outputs/apk -name "app-debug.apk" -exec cp {} release-apks/KasPriv-Wallet-Debug.apk \; || true
          ls -lh release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KasPriv-Wallet-APK
          path: release-apks/*
          if-no-files-found: error

      - name: Create Permanent GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          TAG_NAME="v1.2.0-b${{ github.run_number }}"
          RELEASE_TITLE="KasPriv Wallet APK v1.2.0 (Build ${{ github.run_number }})"
          gh release create "$TAG_NAME" release-apks/* \
            --title "$RELEASE_TITLE" \
            --notes "Official KasPriv Android APK build (Release and Debug packages) with native Kaspa adaptive launcher icons." \
            --latest || echo "Release creation completed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
