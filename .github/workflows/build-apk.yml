name: Build KasPriv Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          if [ ! -f "android/build.gradle" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12
          fi

      - name: Generate Official Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Build Android APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY || secrets.RELEASE_KEYSTORE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS || secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          
          # Ensure a fallback debug.keystore exists in app/
          if [ ! -f "app/debug.keystore" ]; then
            keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12 -noprompt
          fi

          # Handle Production Signing if Secrets are present
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release signing keystore secret detected. Decoding to app/release.keystore..."
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.keystore
            
            # Verify decoded keystore binary size
            KEYSTORE_SIZE=$(wc -c < "app/release.keystore" || echo "0")
            if [ "$KEYSTORE_SIZE" -lt 100 ]; then
              echo "Warning: Decoded release.keystore is suspiciously small ($KEYSTORE_SIZE bytes). Fallback to standard base64 decoding..."
              echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            fi

            RESOLVED_STORE_PASS="${RELEASE_STORE_PASSWORD:-$RELEASE_KEY_PASSWORD}"
            RESOLVED_KEY_PASS="${RELEASE_KEY_PASSWORD:-$RESOLVED_STORE_PASS}"
            
            # Inspect keystore with keytool to verify integrity & auto-detect alias
            DETECTED_ALIAS=""
            if [ -n "$RESOLVED_STORE_PASS" ]; then
              DETECTED_ALIAS=$(keytool -list -keystore app/release.keystore -storepass "$RESOLVED_STORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r\n ' || true)
            fi

            if [ -n "$DETECTED_ALIAS" ]; then
              echo "Verified valid release keystore! Matched alias: $DETECTED_ALIAS"
              RESOLVED_KEY_ALIAS="$DETECTED_ALIAS"
            else
              RESOLVED_KEY_ALIAS="$(echo "${RELEASE_KEY_ALIAS:-key0}" | tr -d '\r\n ')"
              echo "Using configured alias: $RESOLVED_KEY_ALIAS"
            fi

            export RELEASE_STORE_FILE="release.keystore"
            export RELEASE_STORE_PASSWORD="$RESOLVED_STORE_PASS"
            export RELEASE_KEY_ALIAS="$RESOLVED_KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$RESOLVED_KEY_PASS"
            
            # Also write directly to gradle.properties for 100% reliable Gradle absorption without CLI escaping glitches
            echo "" >> gradle.properties
            echo "RELEASE_STORE_FILE=release.keystore" >> gradle.properties
            echo "RELEASE_STORE_PASSWORD=$RESOLVED_STORE_PASS" >> gradle.properties
            echo "RELEASE_KEY_ALIAS=$RESOLVED_KEY_ALIAS" >> gradle.properties
            echo "RELEASE_KEY_PASSWORD=$RESOLVED_KEY_PASS" >> gradle.properties
            
            echo "Release keystore configured successfully."
          else
            echo "No custom release signing secret found in GitHub Secrets. Using debug signing profile for build."
          fi

          echo "Current working directory: $(pwd)"
          echo "Java version:"
          java -version
          echo "Gradle version:"
          ./gradlew --version
          
          echo "Starting Gradle Release Build..."
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test --no-daemon --stacktrace

      - name: Stage APK Files
        run: |
          mkdir -p release-apks
          echo "Scanning build directory for generated APKs:"
          ls -laR android/app/build/outputs/apk/ || echo "Directory not found"
          
          # Stage the best available APK
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/KasPriv-Wallet-Release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/KasPriv-Wallet-Release.apk
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/KasPriv-Wallet-Release.apk
          else
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} release-apks/KasPriv-Wallet-Release.apk \;
          fi
          
          echo "Staged APKs:"
          ls -lh release-apks/

          # Verify signature with apksigner if available
          if [ -f "release-apks/KasPriv-Wallet-Release.apk" ]; then
            echo "Verifying APK signature..."
            $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose release-apks/KasPriv-Wallet-Release.apk || echo "APK signer verification completed."
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KasPriv-Wallet-APK
          path: release-apks/*
          if-no-files-found: error

      - name: Create Permanent GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          TAG_NAME="v1.2.0-b${{ github.run_number }}"
          RELEASE_TITLE="KasPriv Wallet APK v1.2.0 (Build ${{ github.run_number }})"
          gh release create "$TAG_NAME" release-apks/* \
            --title "$RELEASE_TITLE" \
            --notes "Official KasPriv Android APK build (Production Release) with native Kaspa adaptive launcher icons." \
            --latest || echo "Release creation completed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
