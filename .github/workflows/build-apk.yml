name: Build KasPriv Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Security Regression Suite
        run: npm run test:security

      - name: Generate Pristine Native Icons
        run: |
          npm install --no-save sharp
          node scripts/generate_android_icons.cjs

      - name: Build Web Assets
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          if [ ! -f "android/build.gradle" ]; then
            npx cap add android
          fi
          # Only copy web assets into assets/public without overwriting native Gradle/Kotlin/KSP configuration
          npx cap copy android || true

      - name: Generate Official Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Android APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEY || secrets.RELEASE_KEYSTORE || vars.RELEASE_KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.STORE_PASSWORD || vars.RELEASE_STORE_PASSWORD || vars.STORE_PASSWORD || vars.SIGNING_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS || secrets.ALIAS || vars.RELEASE_KEY_ALIAS || vars.KEY_ALIAS || vars.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || vars.RELEASE_KEY_PASSWORD || vars.KEY_PASSWORD }}
        run: |
          cd android
          
          # Handle Production Signing if Secrets are present
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release signing keystore secret detected. Decoding to app/release.keystore..."
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.keystore
            
            # Verify decoded keystore binary size
            KEYSTORE_SIZE=$(wc -c < "app/release.keystore" || echo "0")
            if [ "$KEYSTORE_SIZE" -lt 100 ]; then
              echo "Warning: Decoded release.keystore is suspiciously small ($KEYSTORE_SIZE bytes). Fallback to standard base64 decoding..."
              echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            fi

            RESOLVED_STORE_PASS="${RELEASE_STORE_PASSWORD:-$RELEASE_KEY_PASSWORD}"
            RESOLVED_KEY_PASS="${RELEASE_KEY_PASSWORD:-$RESOLVED_STORE_PASS}"
            
            # Inspect keystore with keytool to verify integrity & auto-detect alias
            DETECTED_ALIAS=""
            if [ -n "$RESOLVED_STORE_PASS" ]; then
              DETECTED_ALIAS=$(keytool -list -keystore app/release.keystore -storepass "$RESOLVED_STORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r\n ' || true)
            fi

            if [ -n "$DETECTED_ALIAS" ]; then
              echo "Verified valid release keystore! Matched alias: $DETECTED_ALIAS"
              RESOLVED_KEY_ALIAS="$DETECTED_ALIAS"
            else
              RESOLVED_KEY_ALIAS="$(echo "${RELEASE_KEY_ALIAS:-key0}" | tr -d '\r\n ')"
              echo "Using configured alias: $RESOLVED_KEY_ALIAS"
            fi

            export RELEASE_STORE_FILE="release.keystore"
            export RELEASE_STORE_PASSWORD="$RESOLVED_STORE_PASS"
            export RELEASE_KEY_ALIAS="$RESOLVED_KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$RESOLVED_KEY_PASS"
            
            # Also write directly to gradle.properties for 100% reliable Gradle absorption without CLI escaping glitches
            echo "" >> gradle.properties
            echo "RELEASE_STORE_FILE=release.keystore" >> gradle.properties
            echo "RELEASE_STORE_PASSWORD=$RESOLVED_STORE_PASS" >> gradle.properties
            echo "RELEASE_KEY_ALIAS=$RESOLVED_KEY_ALIAS" >> gradle.properties
            echo "RELEASE_KEY_PASSWORD=$RESOLVED_KEY_PASS" >> gradle.properties
            
            echo "Release keystore configured successfully."
          else
            echo "Error: No custom release signing secret found in GitHub Secrets. Refusing to build production release with debug or missing keys."
            exit 1
          fi

          echo "Current working directory: $(pwd)"
          echo "Java version:"
          java -version
          echo "Gradle version:"
          ./gradlew --version
          
          echo "Starting Gradle Release Build..."
          ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Stage APK Files
        run: |
          mkdir -p release-apks
          echo "Scanning build directory for generated APKs:"
          ls -laR android/app/build/outputs/apk/ || echo "Directory not found"
          
          # Stage ONLY the signed production release APK (no unsigned or debug fallbacks)
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/KasPriv-Wallet-Release.apk
          else
            echo "CRITICAL: Signed production release APK (app-release.apk) not found! Refusing to stage debug or unsigned APKs."
            exit 1
          fi
          
          echo "Staged APKs:"
          ls -lh release-apks/

          # Verify signature with apksigner - MUST fail build if signature verification fails
          echo "Verifying APK signature..."
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose release-apks/KasPriv-Wallet-Release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KasPriv-Wallet-APK
          path: release-apks/*
          if-no-files-found: error

      - name: Create Permanent GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          TAG_NAME="v1.2.0-b${{ github.run_number }}"
          RELEASE_TITLE="KasPriv Wallet APK v1.2.0 (Build ${{ github.run_number }})"
          gh release create "$TAG_NAME" release-apks/* \
            --title "$RELEASE_TITLE" \
            --notes "Official KasPriv Android APK build (Production Release) with native Kaspa adaptive launcher icons." \
            --latest || echo "Release creation completed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
