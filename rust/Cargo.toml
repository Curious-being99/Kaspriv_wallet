[package]
name = "kaspriv_core"
version = "1.2.0"
edition = "2021"
description = "Kaspa Private Wallet Native Rust Core & JNI Bridge for Schnorr signing, UTXO Mass Calculation, and Safe Enclave Serialization"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
blake2 = "0.10.6"
secp256k1 = { version = "0.28.2", features = ["rand", "serde", "global-context"] }
zeroize = { version = "1.7.0", features = ["derive"] }
thiserror = "1.0.56"
hex = "0.4.3"
rand = "0.8.5"
