apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace = "com.kaspriv.wallet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.incremental":"false"]
            }
        }

        applicationId "com.kaspriv.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            def resolvedStoreFile = null
            def keystorePath = (project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE').toString() : null) ?: System.getenv('RELEASE_STORE_FILE') ?: System.getenv('KEYSTORE_FILE')
            
            if (keystorePath) {
                def direct = file(keystorePath)
                if (direct.exists()) {
                    resolvedStoreFile = direct
                } else if (file("app/${keystorePath}").exists()) {
                    resolvedStoreFile = file("app/${keystorePath}")
                } else if (rootProject.file(keystorePath).exists()) {
                    resolvedStoreFile = rootProject.file(keystorePath)
                } else if (rootProject.file("app/${keystorePath}").exists()) {
                    resolvedStoreFile = rootProject.file("app/${keystorePath}")
                }
            }
            if (resolvedStoreFile == null && file('release.keystore').exists()) {
                resolvedStoreFile = file('release.keystore')
            }
            if (resolvedStoreFile == null && file('../app/release.keystore').exists()) {
                resolvedStoreFile = file('../app/release.keystore')
            }
            if (resolvedStoreFile == null && rootProject.file('app/release.keystore').exists()) {
                resolvedStoreFile = rootProject.file('app/release.keystore')
            }

            def storePass = (project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD').toString() : null) ?: System.getenv('RELEASE_STORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD') ?: System.getenv('SIGNING_STORE_PASSWORD') ?: System.getenv('STORE_PASSWORD')
            def keyAliasVal = (project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS').toString() : null) ?: System.getenv('RELEASE_KEY_ALIAS') ?: System.getenv('KEY_ALIAS') ?: System.getenv('SIGNING_KEY_ALIAS') ?: System.getenv('ALIAS')
            def keyPass = (project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD').toString() : null) ?: System.getenv('RELEASE_KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD') ?: System.getenv('SIGNING_KEY_PASSWORD') ?: storePass

            if (resolvedStoreFile != null && resolvedStoreFile.exists() && storePass) {
                storeFile resolvedStoreFile
                storePassword storePass.trim()
                keyAlias (keyAliasVal ? keyAliasVal.trim() : 'key0')
                keyPassword ((keyPass ?: storePass).trim())
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                // Graceful fallback to debug keystore for builds if release keystore is missing
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = false
        ignoreWarnings = true
        checkDependencies = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Jetpack Room native database storage dependencies
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Kotlin & Coroutines
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs = [
        '--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    ]
}
